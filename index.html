<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bienvenue sur le site festif de Ben Corb.">
  <title>bencorb.com</title>
  <script>
    try {
      const vortexArrival = JSON.parse(sessionStorage.getItem('sitecool:vortex-arrival'));
      const normalizePath = pathname => `${pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || ''}/`;
      const currentPath = normalizePath(window.location.pathname);

      if (vortexArrival?.to === currentPath && Date.now() - vortexArrival.createdAt < 10000) {
        document.documentElement.dataset.vortexArrival = vortexArrival.direction;
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="site-entered" data-page="home">
  <div class="page-scene" id="page-scene">
    <audio id="musique" loop preload="none">
      <source src="assets/audio/bensound-funkyelement.mp3" type="audio/mpeg">
    </audio>
    <audio id="vortex-sound" preload="auto">
      <source src="assets/audio/vortex-whoosh.mp3" type="audio/mpeg">
    </audio>

    <header class="site-header" id="site-header">
      <a class="site-brand" href="index.html" aria-label="Accueil de bencorb.com">bencorb.com</a>
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="https://github.com/BenCorb" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="projets/index.html" data-vortex-link>Projets</a>
      </nav>
    </header>

    <main class="site-content" id="site-content">
      <h1 class="bouncy-text bounce-normal" id="texte-bienvenue">salut, bienvenue sur mon site !</h1>

      <div class="button-container">
        <button type="button" onclick="toggleRaveMode()" aria-label="Activer le mode rave" aria-pressed="false" id="rave-button">💃 🪩 🕺</button>
      </div>
    </main>

    <button type="button" class="sound-toggle" id="sound-toggle" onclick="toggleSound()" aria-label="Lancer la musique" aria-pressed="false" title="Lancer la musique">🔇</button>

    <div class="effects-layer" id="effects-layer" aria-hidden="true"></div>
    <div class="banana-cursor" id="banana-cursor" aria-hidden="true"></div>
  </div>

  <div class="vortex-transition" id="vortex-transition" aria-hidden="true">
    <div class="vortex-glow"></div>
    <div class="vortex-ring"></div>
    <div class="vortex-core"></div>
  </div>

  <script src="js/index.js"></script>
  <script src="js/transition.js"></script>
</body>
</html>
